<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matrix Love</title>
<style>
  html, body{
    margin:0; padding:0; overflow:hidden;
    background:#000; height:100%; width:100%;
    font-family:'Courier New', monospace;
  }
  #matrix{
    position:fixed; inset:0; display:block;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    pointer-events:none;
  }
  #word{
    font-size:min(14vw, 90px);
    font-weight:bold;
    color:#eafff0;
    text-shadow:0 0 20px #7CFC9A, 0 0 40px #7CFC9A;
    opacity:0;
    letter-spacing:2px;
    padding:0 20px;
  }
  #heartWrap{
    display:none;
    flex-direction:column;
    align-items:center;
    opacity:0;
  }
  svg#heart{
    width:min(70vw, 340px);
    filter:drop-shadow(0 0 18px var(--glow, #ff2e6c));
  }
  #finalText{
    margin-top:-46%;
    font-size:min(5vw, 26px);
    color:var(--glow, #ff2e6c);
    font-weight:bold;
    text-shadow:0 0 12px var(--glow, #ff2e6c);
    max-width:80vw;
  }
  #credit{
    position:fixed;
    bottom:18px; left:0; right:0;
    text-align:center;
    color:#888;
    font-size:12px;
    letter-spacing:1px;
  }
  #tapHint{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#7CFC9A;
    font-size:15px;
    letter-spacing:1px;
    background:#000;
    cursor:pointer;
    z-index:10;
  }
</style>
</head>
<body>
  <!-- Многие браузеры блокируют автозвук/canvas-анимацию без взаимодействия — поэтому старт по тапу -->
  <div id="tapHint">&gt; Нажми, чтобы начать</div>

  <canvas id="matrix"></canvas>
  <div id="stage">
    <div id="word"></div>
    <div id="heartWrap">
      <svg id="heart" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 170
                 C 20 110, -10 60, 30 30
                 C 55 10, 90 20, 100 55
                 C 110 20, 145 10, 170 30
                 C 210 60, 180 110, 100 170 Z"
              fill="none" stroke="var(--glow,#ff2e6c)" stroke-width="4" />
      </svg>
      <div id="finalText"></div>
    </div>
  </div>
  <div id="credit"></div>

<script>
/* ======================================================
   ВСЁ НАСТРАИВАЕТСЯ ЗДЕСЬ — никакого сервера/базы не нужно
   ====================================================== */
const CONFIG = {
  fromName: "Dmitry",              // "От кого" — можно оставить пустым ""
  toName: "Anna",                  // "Кому"
  words: ["You", "Are", "My", "Love"], // слова, которые появляются по очереди
  finalMessage: "I Love You ❤️", // текст внутри сердца
  theme: "pink",                  // pink / red / green / blue
};

const params = new URLSearchParams(location.search);
const data = {
  fromName: params.get('from') ?? CONFIG.fromName,
  toName: params.get('to') ?? CONFIG.toName,
  words: params.get('words') ? params.get('words').split(',').map(w=>w.trim()).filter(Boolean) : CONFIG.words,
  finalMessage: params.get('msg') ?? CONFIG.finalMessage,
  theme: params.get('theme') ?? CONFIG.theme,
};

const themeColors = { pink:'#ff2e6c', red:'#ff3b3b', green:'#39ff6a', blue:'#3bb7ff' };
const color = themeColors[data.theme] || themeColors.pink;
document.documentElement.style.setProperty('--glow', color);
document.getElementById('heart').style.setProperty('--glow', color);
document.getElementById('credit').textContent =
  (data.fromName ? `From ${data.fromName} · ` : '') + `for ${data.toName}`;

// ---- Matrix rain (canvas) ----
function startMatrix(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let w, h, columns, drops;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    columns = Math.floor(w / 18);
    drops = new Array(columns).fill(0).map(()=> Math.random()*-50);
  }
  resize();
  window.addEventListener('resize', resize);

  //const chars = '01アイウエオカキクケコ♥❤';
  const chars = 'I01L0ve08you67♥❤';
  function draw(){
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0,0,w,h);
    ctx.font = '16px monospace';
    for(let i=0;i<columns;i++){
      const ch = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle = Math.random() < 0.02 ? '#fff' : color;
      ctx.fillText(ch, i*18, drops[i]*18);
      if(drops[i]*18 > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// ---- Word-by-word reveal, then heart ----
async function play(){
  startMatrix();

  const wordEl = document.getElementById('word');
  const words = data.words.length ? data.words : ['You','Are','Loved'];

  for(const w of words){
    wordEl.textContent = w;
    await fadeIn(wordEl);
    await sleep(1100);
    await fadeOut(wordEl);
  }

  const heartWrap = document.getElementById('heartWrap');
  const finalText = document.getElementById('finalText');
  finalText.textContent = data.finalMessage;
  heartWrap.style.display = 'flex';
  await fadeIn(heartWrap);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function fadeIn(el){
  return new Promise(resolve=>{
    el.style.transition = 'opacity 0.8s ease';
    requestAnimationFrame(()=>{ el.style.opacity = 1; });
    setTimeout(resolve, 800);
  });
}
function fadeOut(el){
  return new Promise(resolve=>{
    el.style.transition = 'opacity 0.6s ease';
    el.style.opacity = 0;
    setTimeout(resolve, 600);
  });
}

document.getElementById('tapHint').addEventListener('click', function(){
  this.remove();
  play();
}, { once:true });
</script>
</body>
</html>
